name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend (Vite)
        run: |
          cd frontend
          npm run build

      - name: Disable Jekyll
        run: touch frontend/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to Surge (Universal Clean Domain)
        env:
          SURGE_LOGIN: salomontchibkere@gmail.com
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN || 'fe5c05c936ebf7952f60a55d7137e302' }}
        run: |
          mkdir -p /tmp/surge_deploy
          cp -r frontend/dist/* /tmp/surge_deploy/
          rm -rf /tmp/surge_deploy/videos
          python3 -c "
          import os
          from PIL import Image
          d = '/tmp/surge_deploy/images'
          if os.path.exists(d):
              for f in os.listdir(d):
                  p = os.path.join(d, f)
                  if os.path.isfile(p) and f.lower().endswith(('.jpg', '.jpeg', '.png')):
                      try:
                          im = Image.open(p)
                          if im.mode in ('RGBA', 'P'): im = im.convert('RGB')
                          im.thumbnail((1600, 1600))
                          im.save(p, 'JPEG', quality=82, optimize=True)
                      except Exception: pass
          "
          cp /tmp/surge_deploy/index.html /tmp/surge_deploy/200.html
          npx -y surge /tmp/surge_deploy ajtes-tchad.surge.sh
